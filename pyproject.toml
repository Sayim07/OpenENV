[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-email-triage"
version = "0.1.0"
description = "OpenEnv Email Triage project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.5.3",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "requests>=2.31.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["email_triage_env*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
