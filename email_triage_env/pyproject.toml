[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email_triage_env"
version = "0.1.0"
description = "Email Triage Environment"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "fastapi",
    "uvicorn",
    "requests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
